<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>

<meta name="application-name" content="مختبر فيزياء السادس">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&family=STIX+Two+Text:ital,wght@0,400;0,500;1,400;1,500&display=swap">

</script>
<style>
/* ============ Tokens ============ */
:root{
  --paper:#F3F6FB; --paper-2:#E9EEF7; --panel:#FFFFFF; --panel-2:#F8FAFD;
  --grid-fine:rgba(55,90,155,.035); --grid-bold:rgba(55,90,155,.06);
  --ink:#17263E; --ink-2:#475970; --ink-3:#5D6E85;
  --line:#DFE6F0; --line-2:#BBCBE2;
  --accent:#355BCD; --accent-hi:#294AB3; --accent-ink:#FFFFFF; --accent-soft:#EAF0FF;
  --bench:#0A1316; --bench-2:#0F1C20; --bench-ink:#E2EEEB; --bench-ink-2:#ABC0BA;
  --good:#16764A; --good-soft:#E4F5EC; --bad:#B83939; --bad-soft:#FBEAEA;
  --ch:#355BCD;
  --shadow:0 3px 10px -6px rgba(33,55,95,.10),0 14px 36px -24px rgba(33,55,95,.18);
  --shadow-lift:0 8px 20px -12px rgba(33,55,95,.12),0 24px 48px -24px rgba(33,55,95,.25);
  --r-s:10px; --r-m:16px; --r-l:22px;
  --top-h:76px; --exp-nav-h:60px;
  --f-body:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-display:var(--f-body);
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-math:"STIX Two Text","Cambria Math","Times New Roman",serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#111925; --paper-2:#202D41; --panel:#192435; --panel-2:#1D2A3D;
  --grid-fine:rgba(160,190,240,.03); --grid-bold:rgba(160,190,240,.06);
  --ink:#EAF0FA; --ink-2:#BDCBE0; --ink-3:#9DADC5;
  --line:#304057; --line-2:#4B6180;
  --accent:#9CB9FF; --accent-hi:#BAD0FF; --accent-ink:#17274E; --accent-soft:#253A61;
  --good:#73DBA6; --good-soft:#1C3B31; --bad:#FF9B9B; --bad-soft:#422C36;
  --shadow:0 10px 30px -18px rgba(0,0,0,.32);
  --shadow-lift:0 20px 50px -22px rgba(0,0,0,.55);
  color-scheme:dark;
}

/* ============ Base ============ */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  font-family:var(--f-body);
  font-size:1rem;
  line-height:1.7;
  color:var(--ink);
  background-color:var(--paper);
  background-image:radial-gradient(ellipse 85% 660px at 95% 0%,rgba(111,154,255,.11),transparent 75%),radial-gradient(ellipse 65% 530px at 0% 380px,rgba(68,176,184,.055),transparent 75%);
  background-repeat:no-repeat;
  -webkit-font-smoothing:antialiased;
  overflow-x:clip;
}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
.ltr{direction:ltr;unicode-bidi:isolate}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{width:100%;max-width:1320px;margin-inline:auto;padding-inline:clamp(16px,3.2vw,40px)}

/* ============ Top bar ============ */
.topbar{
  position:sticky;top:0;z-index:40;height:var(--top-h);
  background:color-mix(in srgb,var(--paper) 86%,transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid var(--line);
}
@supports not (background:color-mix(in srgb,red 50%,blue)){.topbar{background:var(--paper)}}
.topbar .wrap{height:100%;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand svg{width:34px;height:34px;flex:none}
.brand-name{font-family:var(--f-display);font-weight:600;font-size:1.1875rem;letter-spacing:0;white-space:nowrap}
.brand-name small{display:block;font-family:var(--f-body);font-size:0.6875rem;font-weight:500;color:var(--ink-3);line-height:1;margin-top:2px}
.crumbs{display:flex;align-items:center;gap:8px;min-width:0;flex:1;font-size:0.875rem;color:var(--ink-2)}
.crumbs a{text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs a:hover{color:var(--ink)}
.crumbs .sep{color:var(--line-2)}
.crumbs .dot{width:8px;height:8px;border-radius:50%;background:var(--ch);flex:none}
.search-btn{
  display:flex;align-items:center;gap:10px;height:40px;padding-inline:12px 8px;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;color:var(--ink-2);font-size:0.875rem;
  transition:border-color .15s,box-shadow .15s;margin-inline-start:auto;
}
.search-btn:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.search-btn svg{width:18px;height:18px}
.search-btn kbd{font-family:var(--f-mono);font-size:0.75rem;border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--ink-3)}
@media (max-width:760px){
  .crumbs{display:none}
  .search-btn .lbl,.search-btn kbd{display:none}
  .search-btn{width:40px;padding:0;justify-content:center}
  .brand-name{font-size:1.0625rem}
}

/* ============ Buttons ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:0 20px;border-radius:999px;border:1px solid transparent;
  font-weight:600;font-size:0.9375rem;text-decoration:none;white-space:nowrap;
  transition:transform .12s,background .15s,border-color .15s,box-shadow .15s;
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 20px -10px var(--accent)}
.btn.primary:hover{background:var(--accent-hi)}
.btn.ghost{background:var(--panel);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--line-2)}
.btn.sm{min-height:36px;padding:0 14px;font-size:0.875rem}
.btn svg{width:18px;height:18px}

/* ============ Hero ============ */
.hero{padding-block:clamp(28px,5vw,64px) clamp(24px,4vw,48px)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:clamp(24px,4vw,56px);align-items:center}
.eyebrow{font-size:0.8125rem;font-weight:600;color:var(--accent);letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:26px;height:2px;background:currentColor;border-radius:2px}
.hero-title{
  font-family:var(--f-display);font-weight:700;
  font-size:clamp(56px,9.4vw,124px);line-height:1.02;margin-block:14px 18px;letter-spacing:0;
}
.hero-title span{color:var(--accent)}
.lede{font-size:clamp(16px,1.6vw,19px);color:var(--ink-2);max-width:52ch;line-height:1.85}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.hero-facts{display:flex;flex-wrap:wrap;gap:8px 26px;margin:28px 0 0;padding:0}
.hero-facts div{display:flex;align-items:baseline;gap:8px}
.hero-facts dt{font-family:var(--f-display);font-size:1.75rem;font-weight:600;color:var(--ink);line-height:1}
.hero-facts dd{margin:0;font-size:0.875rem;color:var(--ink-2)}
.hero-bench{margin:0;position:relative}
.hero-bench .screen{
  position:relative;border-radius:var(--r-l);overflow:hidden;background:var(--bench);
  aspect-ratio:16/11;box-shadow:var(--shadow-lift);border:1px solid rgba(255,255,255,.04);
  max-width:100%;
}
.hero-bench canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.hero-bench canvas:active{cursor:grabbing}
.hero-bench figcaption{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;font-size:0.8125rem;color:var(--ink-3)}
.hero-bench figcaption b{color:var(--ink-2);font-weight:600}
.screen-tag{
  position:absolute;top:12px;inset-inline-start:12px;z-index:2;
  font-size:0.75rem;font-weight:600;color:var(--bench-ink);background:rgba(6,12,14,.6);
  border:1px solid rgba(220,235,232,.12);border-radius:999px;padding:3px 10px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.screen-read{
  position:absolute;bottom:12px;inset-inline-end:12px;z-index:2;
  font-family:var(--f-mono);font-size:0.75rem;color:var(--bench-ink);background:rgba(6,12,14,.6);
  border:1px solid rgba(220,235,232,.12);border-radius:8px;padding:4px 10px;direction:ltr;
}
@media (max-width:900px){
  .hero .wrap{grid-template-columns:1fr}
  .hero-title{margin-block:10px 14px}
}

/* ============ Resume & chapter nav ============ */
.resume{margin-bottom:28px}
.resume-card{
  display:flex;align-items:center;gap:16px;padding:14px 16px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r-l);text-decoration:none;box-shadow:var(--shadow);
}
.resume-card .k{font-size:0.75rem;color:var(--ink-3)}
.resume-card .t{font-weight:600}
.resume-card .go{margin-inline-start:auto;color:var(--accent);font-weight:600;font-size:0.875rem;white-space:nowrap}
.resume-card .sw{width:10px;height:40px;border-radius:5px;background:var(--ch);flex:none}

.ch-nav{
  position:sticky;top:var(--top-h);z-index:30;padding-block:10px;
  background:color-mix(in srgb,var(--paper) 90%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
@supports not (background:color-mix(in srgb,red 50%,blue)){.ch-nav{background:var(--paper)}}
.ch-nav .wrap{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.ch-nav .wrap::-webkit-scrollbar{display:none}
.ch-chip{
  flex:none;display:flex;align-items:center;gap:8px;height:36px;padding-inline:6px 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);text-decoration:none;font-size:0.875rem;color:var(--ink-2);white-space:nowrap;
}
.ch-chip i{
  font-style:normal;font-family:var(--f-display);font-weight:600;width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;background:var(--ch);color:#fff;font-size:0.875rem;line-height:1;
}
.ch-chip:hover{border-color:var(--ch);color:var(--ink)}

/* ============ Chapters ============ */
.chapters{padding-block:24px 40px;display:flex;flex-direction:column;gap:clamp(40px,6vw,72px)}
.chapter{scroll-margin-top:calc(var(--top-h) + 70px)}
.ch-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 18px;align-items:end;margin-bottom:18px}
.ch-num{
  font-family:var(--f-display);font-weight:700;font-size:clamp(64px,8vw,96px);line-height:.8;color:var(--ch);
  grid-column:1;grid-row:1 / span 2;align-self:center;min-width:.9em;text-align:center;
}
.ch-kicker{grid-column:2;grid-row:1;font-size:0.8125rem;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap}
.ch-kicker .en{direction:ltr;unicode-bidi:isolate;letter-spacing:.04em;text-transform:uppercase;font-size:0.75rem}
.ch-title{grid-column:2;grid-row:2;font-family:var(--f-display);font-weight:600;font-size:clamp(26px,3.2vw,38px)}
.ch-meter{grid-column:3;grid-row:1 / span 2;align-self:center;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:0.8125rem;color:var(--ink-2);white-space:nowrap}
.ch-meter .bar{width:120px;height:6px;border-radius:6px;background:var(--paper-2);overflow:hidden;border:1px solid var(--line)}
.ch-meter .bar span{display:block;height:100%;background:var(--ch);border-radius:6px;width:0}
.ch-blurb{grid-column:2 / 4;grid-row:3;color:var(--ink-2);font-size:0.9375rem;max-width:70ch;margin-top:4px}
@media (max-width:640px){
  .ch-head{grid-template-columns:auto minmax(0,1fr)}
  .ch-blurb{grid-column:1 / -1;grid-row:3}
  .ch-meter{grid-column:1 / -1;grid-row:4;flex-direction:row;align-items:center;justify-content:flex-start}
}

.ch-soon{padding:18px;border:1px dashed var(--line-2);border-radius:var(--r-l);color:var(--ink-3);font-size:0.875rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:14px}
@media (max-width:640px){
  .tiles{
    display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;
    margin-inline:-16px;padding-inline:16px;padding-bottom:6px;scrollbar-width:none;
  }
  .tiles::-webkit-scrollbar{display:none}
  .tiles .tile{flex:0 0 76%;scroll-snap-align:start}
}
.tile{
  display:flex;flex-direction:column;text-decoration:none;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s;
}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);border-color:var(--line-2)}
.thumb{position:relative;aspect-ratio:16/10;background:var(--bench);overflow:hidden}
.thumb canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.thumb .sec{
  position:absolute;top:8px;inset-inline-start:8px;font-family:var(--f-mono);font-size:0.6875rem;
  color:var(--bench-ink);background:rgba(6,12,14,.62);border:1px solid rgba(220,235,232,.12);
  border-radius:999px;padding:1px 8px;direction:ltr;
}
.thumb .state{
  position:absolute;top:8px;inset-inline-end:8px;width:24px;height:24px;border-radius:50%;
  display:grid;place-items:center;background:rgba(6,12,14,.62);border:1px solid rgba(220,235,232,.14);color:var(--bench-ink)
}
.thumb .state svg{width:14px;height:14px}
.thumb .state.done{background:var(--good);border-color:transparent;color:#fff}
.tile-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.tile-body h3{font-size:1rem;font-weight:600;line-height:1.45}
.tile-body p{font-size:0.8125rem;color:var(--ink-3);line-height:1.6}
.tile-foot{margin-top:auto;padding-top:8px;display:flex;align-items:center;gap:8px;font-size:0.75rem;color:var(--ink-3)}
.pips{display:flex;gap:3px}
.pips i{width:14px;height:4px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--ch)}

.site-foot{border-top:1px solid var(--line);padding-block:26px max(40px,env(safe-area-inset-bottom));color:var(--ink-3);font-size:0.8125rem}
.site-foot .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;justify-content:space-between}
.site-foot .foot-copy{max-width:72ch}
.dev-credit{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);text-decoration:none;color:var(--ink-2);font-weight:600;transition:border-color .15s,background .15s,color .15s,transform .15s}
.dev-credit:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.dev-credit:active{transform:translateY(1px)}
.dev-credit svg{width:16px;height:16px;flex:none}
.top-actions{display:flex;align-items:center;gap:7px;margin-inline-start:auto}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink-2);transition:border-color .15s,background .15s,color .15s,transform .12s}
.icon-btn:hover{border-color:var(--line-2);background:var(--panel-2);color:var(--ink)}
.icon-btn:active{transform:translateY(1px)}
.icon-btn svg{width:18px;height:18px}
.to-top{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:35;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);color:var(--ink);box-shadow:var(--shadow-lift);display:grid;place-items:center;opacity:0;transform:translateY(10px) scale(.96);pointer-events:none;transition:opacity .18s,transform .18s,border-color .15s;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.to-top.show{opacity:1;transform:none;pointer-events:auto}
.to-top:hover{border-color:var(--accent)}
.to-top svg{width:18px;height:18px}
.mobile-home{display:none}
@media (max-width:640px){
  :root{--top-h:56px}
  .wrap{padding-inline:14px}
  .topbar .wrap{gap:9px}
  .brand svg{width:30px;height:30px}
  .brand-name{font-size:0.9375rem;line-height:1.1}
  .brand-name small{font-size:0.59375rem;max-width:152px;overflow:hidden;text-overflow:ellipsis}
  .top-actions{gap:5px}
  .search-btn,.icon-btn{width:38px;height:38px;min-width:38px}
  .hero{padding-block:24px 28px}
  .hero-title{font-size:clamp(44px,16vw,68px)}
  .lede{font-size:0.9375rem;line-height:1.8}
  .hero-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .hero-actions .btn{padding-inline:12px;min-width:0;font-size:0.84375rem}
  .hero-facts{gap:8px 18px;margin-top:22px}
  .hero-facts dt{font-size:1.5rem}
  .hero-bench figcaption{line-height:1.65}
  .ch-nav{padding-block:8px}
  .ch-nav .wrap{padding-inline:14px}
  .ch-chip{height:34px;font-size:0.8125rem}
  .tiles{margin-inline:-14px;padding-inline:14px}
  .tiles .tile{flex-basis:84%}
  .site-foot .wrap{flex-direction:column;align-items:flex-start}
  .dev-credit{min-height:40px}
  .to-top{width:42px;height:42px;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom))}
}
@media (hover:none){
  .tile:hover{transform:none;box-shadow:none}
  .btn:hover,.search-btn:hover,.icon-btn:hover,.dev-credit:hover{transform:none}
}
@supports (padding:max(0px)){
  .topbar .wrap{padding-left:max(clamp(16px,3.2vw,40px),env(safe-area-inset-left));padding-right:max(clamp(16px,3.2vw,40px),env(safe-area-inset-right))}
}

/* ============ Experiment page ============ */
.exp-head{padding-block:22px 18px;display:grid;gap:8px}
.exp-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:0.8125rem;color:var(--ink-2)}
.exp-meta .chap{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;color:var(--ink)}
.exp-meta .chap i{width:10px;height:10px;border-radius:50%;background:var(--ch)}
.exp-meta .sec{font-family:var(--f-mono);font-size:0.75rem;border:1px solid var(--line);border-radius:999px;padding:1px 9px;background:var(--panel);direction:ltr}
.exp-title{font-family:var(--f-display);font-weight:600;font-size:clamp(28px,4vw,46px)}
.goal{color:var(--ink-2);max-width:76ch;font-size:clamp(15px,1.4vw,17px)}
.goal b{color:var(--ink);font-weight:600}

.bench{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,360px);gap:16px;align-items:start}
.stage-col,.panel-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.stage-wrap,.graph-card,.card,.stage-sticky,.readouts{min-width:0;max-width:100%}
.stage-wrap{
  position:relative;background:var(--bench);border-radius:var(--r-l);box-shadow:var(--shadow-lift);overflow:hidden;
  border:1px solid rgba(255,255,255,.04);
}
.stage{position:relative;aspect-ratio:16/10;width:100%}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none}
.stage-bar{position:absolute;top:0;left:0;right:0;aspect-ratio:16/10;pointer-events:none;z-index:3}
.stage-tools{
  position:absolute;top:8px;inset-inline-end:8px;display:flex;gap:2px;padding:3px;border-radius:12px;pointer-events:auto;
  background:rgba(8,16,19,.62);border:1px solid rgba(220,235,232,.12);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.tool{
  width:34px;height:34px;border-radius:9px;border:0;background:transparent;color:var(--bench-ink);display:grid;place-items:center;
  transition:background .15s,color .15s;
}
.tool:hover{background:rgba(220,235,232,.1)}
.tool svg{width:17px;height:17px}
.tool.speed{width:auto;padding-inline:8px;font-family:var(--f-mono);font-size:0.75rem;direction:ltr}
.tool[aria-pressed="true"]{background:rgba(233,139,76,.2);color:#FFD2B3}
.stage-hint{
  position:absolute;bottom:10px;inset-inline-start:10px;max-width:calc(100% - 20px);
  font-size:0.78125rem;color:var(--bench-ink);background:rgba(8,16,19,.66);border:1px solid rgba(220,235,232,.12);
  border-radius:999px;padding:4px 12px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:flex;align-items:center;gap:8px;transition:opacity .4s;
}
.stage-hint svg{width:14px;height:14px;flex:none;color:#F2B283}
.stage-hint.fade{opacity:0}
@media (max-width:560px){.tool{width:32px;height:32px}.tool svg{width:16px;height:16px}.tool.speed{padding-inline:5px}}

.readouts{
  display:flex;gap:1px;background:rgba(220,235,232,.07);border-top:1px solid rgba(220,235,232,.07);
  overflow-x:auto;scrollbar-width:none;
}
.readouts::-webkit-scrollbar{display:none}
.ro{
  flex:1 0 auto;min-width:108px;padding:8px 12px 9px;background:var(--bench-2);display:flex;flex-direction:column;gap:1px;
}
.ro .l{font-size:0.71875rem;color:var(--bench-ink-2);white-space:nowrap}
.ro .v{font-family:var(--f-mono);font-size:1.0625rem;font-weight:500;color:#F4FBF9;direction:ltr;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ro .v small{font-size:0.71875rem;color:var(--bench-ink-2);margin-left:4px;font-weight:400}
.ro.rec{flex:0 0 auto;min-width:0;justify-content:center;padding:6px 10px;position:sticky;left:0;z-index:1;box-shadow:10px 0 14px -8px rgba(0,0,0,.6)}
.rec-btn{
  display:flex;align-items:center;gap:7px;height:38px;padding-inline:12px 14px;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);border:0;font-weight:600;font-size:0.84375rem;white-space:nowrap;
}
.rec-btn:hover{background:var(--accent-hi)}
.rec-btn .dot{width:9px;height:9px;border-radius:50%;background:currentColor}
.rec-btn.flash{animation:recflash .5s}
@keyframes recflash{0%{box-shadow:0 0 0 0 rgba(233,139,76,.7)}100%{box-shadow:0 0 0 14px rgba(233,139,76,0)}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:0.9375rem;font-weight:600}
.card-h .aux{margin-inline-start:auto;font-size:0.78125rem;color:var(--ink-3)}
.card-b{padding:14px 16px 16px}

.graph-card{background:var(--bench);border-radius:var(--r-l);overflow:hidden;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.04)}
.graph-card .card-h{border-color:rgba(220,235,232,.08);color:var(--bench-ink);padding-block:9px}
.graph-card .card-h h2{font-size:0.84375rem}
.graph-card .card-h .aux{color:var(--bench-ink-2)}
.graph-card .card-h svg{width:16px;height:16px;color:#F2B283}
.graph{position:relative;height:clamp(190px,24vw,250px)}
.graph canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* controls */
.controls{display:flex;flex-direction:column;gap:14px}
.ctl-head{font-size:0.75rem;font-weight:600;color:var(--ink-3);letter-spacing:.02em;padding-top:4px;border-top:1px dashed var(--line);margin-top:2px}
.ctl-head:first-child{border-top:0;padding-top:0;margin-top:0}
.ctl-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.ctl label,.ctl .ctl-label{font-size:0.875rem;font-weight:500;color:var(--ink)}
.ctl output{font-family:var(--f-mono);font-size:0.875rem;color:var(--ink);direction:ltr;white-space:nowrap;font-variant-numeric:tabular-nums}
.ctl output span{color:var(--ink-3);font-size:0.75rem;margin-left:3px}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;cursor:pointer;touch-action:pan-y;
}
input[type=range]::-webkit-slider-runnable-track{
  height:6px;border-radius:6px;background:linear-gradient(to left,var(--accent) var(--p,50%),var(--paper-2) var(--p,50%));border:1px solid var(--line);
}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:var(--paper-2);border:1px solid var(--line)}
input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;margin-top:-9px;
  background:var(--panel);border:2px solid var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .12s;
}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--accent-soft)}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:3px;border-radius:12px;background:var(--paper-2);border:1px solid var(--line);margin-top:6px}
.seg button{
  flex:1 1 auto;min-height:36px;padding:4px 10px;border-radius:9px;border:0;background:transparent;font-size:0.84375rem;color:var(--ink-2);font-weight:500;
}
.seg button[aria-checked="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.ctl select{
  width:100%;margin-top:6px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);padding-inline:12px 30px;
  appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:14px 18px,19px 18px;background-size:5px 5px;background-repeat:no-repeat;
}
.ctl-toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:0.875rem;min-height:32px}
.ctl-toggle input{position:absolute;opacity:0;pointer-events:none}
.ctl-toggle .sw{width:40px;height:24px;border-radius:12px;background:var(--paper-2);border:1px solid var(--line-2);position:relative;flex:none;transition:background .15s}
.ctl-toggle .sw::after{content:"";position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.ctl-toggle input:checked + .sw{background:var(--accent);border-color:var(--accent)}
.ctl-toggle input:checked + .sw::after{transform:translateX(-16px)}
.ctl-toggle input:focus-visible + .sw{outline:2.5px solid var(--accent);outline-offset:2px}
.ctl-btns{display:flex;flex-wrap:wrap;gap:8px}
.ctl-btns .btn{flex:1 1 auto}

/* tasks */
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.tasks li{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:8px 4px;font-size:0.875rem;line-height:1.6;color:var(--ink-2);border-radius:8px}
.tasks .box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line-2);display:grid;place-items:center;margin-top:1px;transition:all .25s}
.tasks .box svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:all .25s}
.tasks li.done{color:var(--ink)}
.tasks li.done .box{background:var(--good);border-color:var(--good);color:#fff}
.tasks li.done .box svg{opacity:1;transform:none}
.tasks li.just{animation:justdone 1.2s ease}
@keyframes justdone{0%{background:var(--good-soft)}100%{background:transparent}}
.ring{width:30px;height:30px;flex:none}
.ring circle{fill:none;stroke-width:3.5}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--good);stroke-linecap:round;transition:stroke-dashoffset .5s}
.stamp{
  display:none;margin-inline-start:auto;font-family:var(--f-display);font-weight:700;font-size:0.875rem;color:var(--good);
  border:2px solid var(--good);border-radius:8px;padding:0 8px;transform:rotate(-6deg);
}
.tasks-card.complete .stamp{display:inline-block;animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:scale(2.2) rotate(-14deg);opacity:0}100%{transform:scale(1) rotate(-6deg);opacity:1}}

/* study tabs */
.study{margin-top:28px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;display:flex;align-items:center;gap:8px;padding:12px 16px 13px;background:none;border:0;border-bottom:2.5px solid transparent;
  font-size:0.9375rem;font-weight:500;color:var(--ink-2);margin-bottom:-1px;white-space:nowrap;
}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:600}
.tab .badge{font-family:var(--f-mono);font-size:0.71875rem;min-width:20px;height:20px;border-radius:10px;padding-inline:6px;display:grid;place-items:center;background:var(--paper-2);border:1px solid var(--line);color:var(--ink-2)}
.tabpanel{padding-block:22px 10px}
@media (max-width:640px){.tab{flex:1 1 auto;justify-content:center;padding:12px 6px 13px;font-size:0.875rem;gap:6px}}

.theory{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.theory{grid-template-columns:minmax(0,1fr)}}
.prose{display:flex;flex-direction:column;gap:14px;max-width:68ch}
.prose h3{font-size:1.0625rem;font-weight:600;margin-top:6px}
.prose p,.prose li{color:var(--ink-2);line-height:1.9}
.prose b{color:var(--ink);font-weight:600}
.prose ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.tools-list{display:flex;flex-wrap:wrap;gap:6px}
.tools-list span{font-size:0.8125rem;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 10px;color:var(--ink-2)}
.laws{display:flex;flex-direction:column;gap:10px}
.law{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.law .eq{font-family:var(--f-math);font-size:1.375rem;direction:ltr;text-align:center;color:var(--ink);line-height:1.5;padding-block:4px;overflow-x:auto}
.law .eq i{font-style:italic}
.law .d{font-size:0.84375rem;color:var(--ink-2);text-align:center}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin-inline:3px;line-height:1.25}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding-inline:4px}
.fr>span:last-child{padding-inline:4px}
.sq{white-space:nowrap}
.sq>span{border-top:1.5px solid currentColor;padding-inline:2px}
.note{border-inline-start:3px solid var(--ch);background:var(--panel);padding:10px 14px;border-radius:0 var(--r-m) var(--r-m) 0;font-size:0.90625rem;color:var(--ink-2)}
.note b{color:var(--ink)}

/* recorder */
.rec-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
@media (max-width:900px){.rec-grid{grid-template-columns:minmax(0,1fr)}}
.rec-grid>div{min-width:0}
.rec-table-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m)}
.rec-table{width:100%;border-collapse:collapse;font-size:0.875rem}
.rec-table th,.rec-table td{padding:8px 12px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.rec-table th{font-weight:600;font-size:0.8125rem;color:var(--ink-2);background:var(--panel-2)}
.rec-table th small{display:block;font-family:var(--f-mono);font-weight:400;font-size:0.6875rem;color:var(--ink-3);direction:ltr}
.rec-table td{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr}
.rec-table tr:last-child td{border-bottom:0}
@media (max-width:640px){.rec-table th{white-space:normal;line-height:1.35;padding-inline:8px}.rec-table th:not(:first-child):not(:last-child){min-width:72px}.rec-table td{padding-inline:8px}}
.rec-table .del{background:none;border:0;color:var(--ink-3);width:28px;height:28px;border-radius:6px}
.rec-table .del:hover{color:var(--bad);background:var(--bad-soft)}
.rec-empty{padding:26px 16px;text-align:center;color:var(--ink-3);font-size:0.875rem}
.rec-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.rec-axes{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:0.8125rem;color:var(--ink-2);margin-bottom:8px}
.rec-axes select{min-height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);padding-inline:8px}
.paper-plot{position:relative;aspect-ratio:4/3;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;max-width:100%}
.paper-plot canvas{position:absolute;inset:0;width:100%;height:100%}
.fit-line{font-size:0.8125rem;color:var(--ink-2);margin-top:8px}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:14px;max-width:820px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px}
.q-t{display:flex;gap:10px;font-weight:600;font-size:1rem;line-height:1.7;margin-bottom:10px}
.q-t .n{font-family:var(--f-display);color:var(--accent);flex:none}
.opts{display:grid;gap:8px}
.opt{
  text-align:start;display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel-2);font-size:0.9375rem;color:var(--ink);transition:border-color .15s,background .15s;
}
.opt:hover:not(:disabled){border-color:var(--line-2);background:var(--paper-2)}
.opt .k{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:0.75rem;flex:none;color:var(--ink-3)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.why{margin-top:10px;font-size:0.875rem;color:var(--ink-2);padding:10px 12px;border-radius:10px;background:var(--paper-2)}
.why b{color:var(--ink)}
.quiz-sum{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;border-radius:var(--r-l);border:1px dashed var(--line-2)}
.quiz-sum .score{font-family:var(--f-display);font-size:1.875rem;font-weight:700;color:var(--accent);line-height:1}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-block:36px 48px}
.pager a{
  display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);text-decoration:none;min-width:0;
}
.pager a:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.pager .k{font-size:0.75rem;color:var(--ink-3)}
.pager .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager .next{text-align:left}
.pager .empty{visibility:hidden}

/* ---------- Mobile bench ---------- */
@media (max-width:980px){
  .bench{display:flex;flex-direction:column;gap:12px}
  .stage-col,.panel-col{display:contents}
  .stage-sticky{position:sticky;top:var(--top-h);z-index:20;order:1;margin-inline:-16px;padding:0 0 8px;background:var(--paper)}
  .stage-wrap{border-radius:0;border-inline:0}
  .stage-bar{position:relative;aspect-ratio:auto;display:flex;align-items:center;gap:8px;height:44px;padding-inline:10px 6px;border-bottom:1px solid rgba(220,235,232,.08);background:var(--bench-2)}
  .stage-tools{position:static;margin-inline-start:auto;background:transparent;border:0;padding:0;flex:none}
  .stage-hint{position:static;flex:1;min-width:0;background:transparent;border:0;padding:0;font-size:0.75rem;color:var(--bench-ink-2)}
  .stage-hint span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stage-hint.fade{opacity:1}
  .stage-sticky.unpinned{position:relative}
  .controls-card{order:2}
  .graph-card{order:3}
  .tasks-card{order:4}
  .stage{aspect-ratio:5/4}
  .ro{min-width:96px;padding:6px 10px 7px}
  .ro .v{font-size:0.9375rem}
}
@media (min-width:981px){
  .stage-sticky{display:contents}
  .tool.pin{display:none}
}
@media (max-width:980px) and (max-height:520px){
  .stage-sticky{position:relative}
}

/* ---------- Focus mode ---------- */
body.focus{overflow:hidden}
body.focus .bench{
  position:fixed;inset:0;z-index:60;background:var(--paper);padding:12px;overflow:auto;
  grid-template-columns:minmax(0,1fr) 340px;
}
body.focus .panel-col{position:relative;top:0}
body.focus .stage{aspect-ratio:auto;height:calc(100vh - 190px);min-height:280px}
body.focus .stage-bar{aspect-ratio:auto;height:calc(100vh - 190px);min-height:280px}
@media (max-width:980px){
  body.focus .bench{display:flex}
  body.focus .stage-sticky{margin:0;top:0;padding:0 0 8px}
  body.focus .stage{height:min(62vh,calc(100vw * .8))}
}

/* ---------- Search ---------- */
.search-ov{position:fixed;inset:0;z-index:100;background:rgba(6,12,11,.5);display:flex;justify-content:center;align-items:flex-start;padding:10vh 16px 16px;overscroll-behavior:contain}
@media (max-width:640px){.search-ov{padding:calc(var(--top-h) + 8px) 10px 10px;align-items:flex-start}.search-box{max-height:calc(100dvh - var(--top-h) - 18px);border-radius:14px}.search-in{padding-inline:12px}.search-in input{height:54px;font-size:1rem}}
.search-box{width:100%;max-width:620px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lift);overflow:hidden;display:flex;flex-direction:column;max-height:76vh}
.search-in{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}
.search-in svg{width:20px;height:20px;color:var(--ink-3);flex:none}
.search-in input{flex:1;height:58px;border:0;background:transparent;font-size:1.0625rem;outline:none;min-width:0}
.search-in button{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;font-size:0.75rem;padding:3px 8px;color:var(--ink-3)}
.search-list{overflow:auto;padding:6px}
.s-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;text-decoration:none}
.s-item i{width:10px;height:10px;border-radius:50%;background:var(--ch);flex:none}
.s-item .t{font-weight:500}
.s-item .c{font-size:0.78125rem;color:var(--ink-3)}
.s-item .sec{margin-inline-start:auto;font-family:var(--f-mono);font-size:0.75rem;color:var(--ink-3);direction:ltr}
.s-item[aria-selected="true"],.s-item:hover{background:var(--paper-2)}
.s-none{padding:22px;text-align:center;color:var(--ink-3)}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);z-index:120;opacity:0;pointer-events:none;
  background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:0.875rem;font-weight:500;
  box-shadow:var(--shadow-lift);transition:opacity .25s,transform .25s;max-width:calc(100vw - 32px);text-align:center;
}

function openSearch() {

  if (document.querySelector('.search-ov')) return;
  postFlutter('search', true);

  ov.innerHTML = '<div class="search-box" role="dialog" aria-modal="true" aria-label="البحث في التجارب"><div class="search-in">' + I.search + '<input id="s-in" type="search" role="combobox" aria-label="اسم التجربة أو المفهوم العلمي" aria-autocomplete="list" aria-expanded="true" aria-controls="s-results" placeholder="ابحث عن تجربة أو مفهوم…" autocomplete="off" enterkeyhint="search"><button type="button" aria-label="إغلاق البحث">' + I.x + '</button></div><div class="search-summary"><span id="searchCount" role="status" aria-live="polite"></span><span class="key-hint">↑ ↓ للتنقل · Enter للفتح</span></div><div class="search-list" id="s-results" role="listbox" aria-label="نتائج البحث"></div></div>';
  document.body.appendChild(ov);
  const inp = ov.querySelector('input'), list = ov.querySelector('.search-list');
  let sel = 0, items = [], closed = false;
  const prevOverflow = document.body.style.overflow, wasInert = app.inert; document.body.style.overflow = 'hidden'; app.inert = true;
  const close = (returnFocus = true) => {
    if (closed) return; closed = true; closeSearchUI = null; document.body.style.overflow = prevOverflow; app.inert = wasInert; ov.remove(); window.removeEventListener('hashchange', onRoute);
    postFlutter('search', false); syncFlutterRoute(location.hash || '#/');
    if (returnFocus && trigger?.isConnected) trigger.focus({preventScroll:true});
  };
  closeSearchUI = close;
  const onRoute = () => close(false); window.addEventListener('hashchange', onRoute);
  const selectItem = () => {
    list.querySelectorAll('.s-item').forEach((el,i) => el.setAttribute('aria-selected',String(i === sel)));
    if (items.length) inp.setAttribute('aria-activedescendant','search-result-' + sel); else inp.removeAttribute('aria-activedescendant');
  };
  const paint = () => {
    const words = norm(inp.value.trim()).split(/\s+/).filter(Boolean);
    items = LAB.exps.filter(e => { const ch = LAB.chapters.find(c => c.n === e.ch); const haystack = norm(e.title + ' ' + (e.short || '') + ' ' + (e.keys || '') + ' ' + ch.title + ' ' + e.sec); return words.every(q => haystack.includes(q)); });
    const recent = Array.isArray(Store.data.recent) ? Store.data.recent : [], rank = e => { const at = recent.indexOf(e.id); return (Store.isFavorite(e.id) ? 100 : 0) + (at >= 0 ? 20 - at : 0); };
    items.sort((a,b) => rank(b) - rank(a));
    sel = Math.min(sel, Math.max(0,items.length-1));
    list.innerHTML = items.length ? items.map((e,i) => {
      const ch = LAB.chapters.find(c => c.n === e.ch), saved = Store.isFavorite(e.id);
      return '<a class="s-item' + (saved ? ' saved' : '') + '" role="option" tabindex="-1" id="search-result-' + i + '" href="#/exp/' + e.id + '" aria-selected="false" style="--ch:' + ch.hue + '"><i aria-hidden="true"></i><span><span class="t">' + bidiHTML(e.title) + (saved ? '<span class="saved-mark">' + I.bookmarkFill + 'محفوظة</span>' : '') + '</span><br><span class="c">الفصل ' + arNum(ch.n) + ' · ' + ch.title + '</span></span><span class="sec">' + e.sec + '</span></a>';
    }).join('') : '<div class="s-none">لا توجد نتائج. جرّب اسم الفصل أو كلمة مثل «متسعة» أو «ليزر».</div>';
    ov.querySelector('#searchCount').textContent = arNum(items.length) + ' تجربة' + (words.length ? ' مطابقة' : ' في المختبر');
    selectItem();
  };
  list.addEventListener('click', ev => { const a = ev.target.closest('a'); if (!a) return; close(false); if (a.hash === location.hash) document.querySelector('.exp-title')?.focus({preventScroll:true}); });
  inp.addEventListener('input', () => { sel = 0; paint(); list.scrollTop = 0; });
  inp.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault(); if (!items.length) return;
      sel = (sel + (ev.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; selectItem();
      const el = list.querySelector('#search-result-' + sel); const top = el.offsetTop - list.offsetTop;
      if (top < list.scrollTop) list.scrollTop = top;
      else if (top + el.offsetHeight > list.scrollTop + list.clientHeight) list.scrollTop = top + el.offsetHeight - list.clientHeight;
    } else if (ev.key === 'Enter' && items[sel]) { ev.preventDefault(); const hash = '#/exp/' + items[sel].id; close(false); if (location.hash === hash) { document.querySelector('.exp-title')?.focus({preventScroll:true}); } else location.hash = hash; }
  });
  ov.addEventListener('keydown', ev => { if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); close(); } else trapTab(ev,ov); });
  ov.addEventListener('click', ev => { if (ev.target === ov) close(); });
  ov.querySelector('.search-in button').addEventListener('click', () => close());
  paint(); inp.focus({preventScroll:true});
}

  activeRoute = h;
  destroyCurrent();
  const m = h.match(/^#\/exp\/([\w-]+)$/);
  if (m) { renderExp(m[1]); syncAppNav(h); syncFlutterRoute(h); revealView(); return; }

        const P = new Plot(g, 0, 0, w, h, { x: [0, 2], y: [-1.25, 1.25], xl: 't / T', yl: 'قيم نسبية', yt: [-1, 0, 1] });

        P.vline(now, 'rgba(255,255,255,0.4)');
        P.legend([['v', C.amber], ['i', C.cyan]]);
      }
    };
    return S;
  }
});

function besselJ(n, x) {
  let sum = 0;
  for (let k = 0; k < 30; k++) {
    let term = Math.pow(-1, k) * Math.pow(x / 2, 2 * k + n);
    let den = 1; for (let i = 2; i <= k; i++) den *= i; let den2 = 1; for (let i = 2; i <= k + n; i++) den2 *= i;
    sum += term / (den * den2);
  }
  return sum;
}

        });
        const aw = this.absW();
        this.ps.forEach(q => {
          const sp = Math.hypot(q.vx, q.vy);
          if (p.B && q.x > g.bx0 && q.x < g.bx1 && q.ty !== 'g') {
            const R = q.ty === 'a' ? 900 : 150, dth = sp / R * dt * (q.ty === 'a' ? -1 : 1);
            const c0 = Math.cos(dth), s0 = Math.sin(dth), vx = q.vx * c0 - q.vy * s0, vy = q.vx * s0 + q.vy * c0; q.vx = vx; q.vy = vy;
          }
          const px = q.x;
          q.x += q.vx * dt; q.y += q.vy * dt; q.d += sp * dt;
          if (q.ty === 'a' && q.d > 540) q.stop = true;
          if (p.abs !== 'none' && px < g.ax && q.x >= g.ax && !q.passedAbs) {
            q.passedAbs = true;
            if (q.ty === 'a') { q.stop = true; q.x = g.ax; }
            else if (q.ty === 'b' && (p.abs === 'al' || p.abs === 'pb')) { q.stop = true; q.x = g.ax; }
            else if (q.ty === 'g') { const tr = p.abs === 'pb' ? Math.exp(-0.5 * p.x) : p.abs === 'al' ? 0.97 : 1; if (Math.random() > tr) { q.stop = true; q.x = g.ax + Math.random() * aw; } }
          }
          if (q.stop) { q.life -= dt * 3; q.vx = 0; q.vy = 0; }
          if (!q.stop && q.x >= g.gx && px < g.gx && Math.abs(q.y - g.sy) < g.gh / 2) { this.hits.push(this.t); a.sound.click(0.12); q.stop = true; q.life = 0.2; }
          if (q.x > this.W + 20 || q.y < -20 || q.y > this.H + 20) q.life = 0;
        });
        this.bgAcc += dt * 0.6; if (this.bgAcc > 1 && Math.random() < 0.02) { this.bgAcc = 0; this.hits.push(this.t); }
        this.ps = this.ps.filter(q => q.life > 0);
        if (this.ps.length > 500) this.ps.splice(0, this.ps.length - 500);
        this.hits = this.hits.filter(t0 => this.t - t0 <= 1);
        this.scope.push(this.t, { c: this.hits.length });
        a.out.cps = this.hits.length; a.out.x = p.abs === 'pb' ? p.x : 0; a.out.tg = p.abs === 'pb' ? Math.exp(-0.5 * p.x) * 100 : p.abs === 'al' ? 97 : 100;
      },
      draw(c, W, H) {
        G.bg(c, W, H);
        const g = this.geom();
        /* source */
        G.rrect(c, g.sx - 50, g.sy - 34, 80, 68, 10, '#3C4B50', 'rgba(220,235,232,0.3)', 1.2);
        G.circle(c, g.sx + 10, g.sy, 12, '#FFD166');
        G.text(c, '☢', g.sx - 18, g.sy, { size: 20, color: '#FFD166' });
        G.text(c, 'المصدر المشع', g.sx - 10, g.sy + 54, { size: 12, color: C.ink2 });
        /* field region */
        if (p.B) {
          G.rrect(c, g.bx0, 40, g.bx1 - g.bx0, H - 80, 10, 'rgba(63,210,190,0.06)', 'rgba(63,210,190,0.35)', 1.2);
          for (let y = 70; y < H - 50; y += 50) for (let x = g.bx0 + 25; x < g.bx1; x += 50) G.cross(c, x, y, 5, 'rgba(63,210,190,0.35)');
          G.text(c, 'B داخل الصفحة', (g.bx0 + g.bx1) / 2, H - 22, { size: 12, color: C.bfield });
        }
        /* absorber */
        const aw = this.absW();
        if (p.abs !== 'none') {
          const col = { paper: '#F4F1E8', al: '#B9C5C9', pb: '#4B5358' }[p.abs];
          G.rrect(c, g.ax, g.sy - 150, aw, 300, 3, col, 'rgba(255,255,255,0.3)', 1);
          G.text(c, { paper: 'ورقة', al: 'ألمنيوم', pb: 'رصاص ' + p.x + ' cm' }[p.abs], g.ax + aw / 2, g.sy + 170, { size: 13, color: C.ink });
        }
        /* particles */
        this.ps.forEach(q => {
          c.globalAlpha = clamp(q.life, 0, 1);
          if (q.ty === 'a') G.circle(c, q.x, q.y, 6, C.pos);
          else if (q.ty === 'b') G.circle(c, q.x, q.y, 3.4, C.neg);
          else G.photon(c, q.x, q.y, Math.atan2(q.vy, q.vx), 26, '#7CFFB0', this.t * 40, 4, 6);
          c.globalAlpha = 1;
        });
        /* GM tube */
        G.rrect(c, g.gx, g.sy - g.gh / 2, 170, g.gh, 18, '#2E3B40', 'rgba(220,235,232,0.35)', 1.5);
        G.rrect(c, g.gx - 4, g.sy - g.gh / 2 + 10, 8, g.gh - 20, 3, 'rgba(158,240,200,0.5)');
        G.text(c, 'أنبوب كايكر', g.gx + 85, g.sy, { size: 13, color: C.ink2 });
        G.lcd(c, g.gx + 85, g.sy + g.gh / 2 + 44, 150, 44, String(this.hits.length).padStart(3, '0') + ' /s', '#9EF0C8');
        const lg = [[C.pos, 'ألفا α (+)'], [C.neg, 'بيتا β (−)'], ['#7CFFB0', 'كاما γ']];
        lg.forEach((q, i) => { G.circle(c, W - 60 - i * 140, 34, 6, q[0]); G.text(c, q[1], W - 72 - i * 140, 34, { size: 12, color: C.ink2, align: 'right' }); });
      },
      graph(gg, w, h) {
        const sc = this.scope, t1 = Math.max(sc.now, 20), mx = Math.max(10, ...(sc.d.c || [0])) * 1.2;
        const P = new Plot(gg, 0, 0, w, h, { x: [t1 - 20, t1], y: [0, mx], xl: 't (s)', yl: 'عدة/s' });
        P.frame(); sc.plot(P, 'c', '#9EF0C8', 2.4);
      }
    };
    return S;
  }
});

})();
LAB.start();
})();
</script>
